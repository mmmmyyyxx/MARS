levels:
  exact_official:
    description: Uses the original official implementation logic with only engineering
      wrappers.
  faithful_reimplementation:
    description: Reimplements the published algorithm closely, including search strategy
      and key hyperparameters.
  best_effort_reimplementation:
    description: Uses a simplified local approximation; not suitable for claiming
      exact reproduction.
  reference_only:
    description: Paper value used only for comparison, never substituted for local
      results.
  prompt_dependent:
    description: Exactness depends on whether local prompt resources match the paper/original
      prompts.
  legacy_aligned_partial:
    description: Core MARS flow and legacy prompt/Target conventions are aligned where
      source evidence is available, but the run is not an exact official reproduction.
methods:
  origin:
    exactness_level: prompt_dependent
    notes: Prompt-dependent; exact only when the local origin prompt matches the original
      paper prompt.
  cot_zs:
    exactness_level: best_effort_reimplementation
    notes: Local CoT baseline; paper reports baseline numbers but the original repository
      does not provide a complete executable baseline protocol.
  cot_fs:
    exactness_level: best_effort_reimplementation
    notes: Local CoT baseline; paper reports baseline numbers but the original repository
      does not provide a complete executable baseline protocol.
